name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/prepare-ffmpeg
        with:
          platform: macos
      - name: Generate release Tauri configuration
        run: node scripts/generate-tauri-release-config.mjs --platform macos --sdk-root .ffmpeg-sdk/macos --output src-tauri/tauri.release.generated.json
      - name: Compile macOS application
        run: pnpm exec tauri build --no-bundle --config src-tauri/tauri.release.generated.json
      - name: Relocate and verify macOS FFmpeg linkage
        run: bash scripts/rewrite-ffmpeg-macos.sh target/release/gblab-desktop target/release/Frameworks
      - name: Bundle macOS application
        run: pnpm exec tauri bundle --config src-tauri/tauri.release.generated.json --bundles app
      - uses: actions/upload-artifact@v4
        with:
          name: gblab-macos
          path: target/release/bundle/macos/*.app
          if-no-files-found: error
