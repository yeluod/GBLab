name: Desktop build

on:
  workflow_call:
    inputs:
      platform:
        required: false
        type: string
        default: all
      ref:
        required: false
        type: string
        default: ''
      bundle:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: choice
        options: [macos, windows, all]
        default: all
      bundle:
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: Select desktop matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            all) printf 'matrix={"include":[{"platform":"macos","runner":"macos-14","architecture":"arm64","timeout":45},{"platform":"windows","runner":"windows-2025","architecture":"x86_64","timeout":45}]}\n' >> "$GITHUB_OUTPUT" ;;
            macos) printf 'matrix={"include":[{"platform":"macos","runner":"macos-14","architecture":"arm64","timeout":45}]}\n' >> "$GITHUB_OUTPUT" ;;
            windows) printf 'matrix={"include":[{"platform":"windows","runner":"windows-2025","architecture":"x86_64","timeout":45}]}\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'Unsupported platform: %s\n' "$PLATFORM" >&2; exit 1 ;;
          esac

  build:
    needs: prepare-matrix
    name: Build ${{ matrix.platform }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/prepare-ffmpeg
        with:
          platform: ${{ matrix.platform }}
      - name: Read application version
        id: metadata
        shell: bash
        run: node -e "process.stdout.write('version=' + require('./package.json').version + String.fromCharCode(10))" >> "$GITHUB_OUTPUT"
      - name: Prepare macOS framework output directory
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release/Frameworks
          cp -Lf .ffmpeg-sdk/macos/frameworks/*.dylib target/release/Frameworks/
      - name: Generate release Tauri configuration
        shell: bash
        run: >-
          node scripts/generate-tauri-release-config.mjs
          --platform "${{ matrix.platform }}"
          --sdk-root ".ffmpeg-sdk/${{ matrix.platform }}"
          ${{ matrix.platform == 'macos' && '--bundle-framework-root target/release/Frameworks' || '' }}
          --output src-tauri/tauri.release.generated.json
      - name: Compile desktop application
        shell: bash
        run: pnpm exec tauri build --no-bundle --config src-tauri/tauri.release.generated.json
      - name: Stage Windows FFmpeg runtime
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: Copy-Item -Force .ffmpeg-sdk/windows/bin/*.dll target/release/
      - name: Verify macOS linkage
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: bash scripts/rewrite-ffmpeg-macos.sh target/release/gblab-desktop target/release/Frameworks
      - name: Verify Windows linkage
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: ./scripts/verify-ffmpeg-windows.ps1 -Binary target/release/gblab-desktop.exe -SdkRoot .ffmpeg-sdk/windows
      - name: Bundle macOS installers
        if: ${{ inputs.bundle && matrix.platform == 'macos' }}
        shell: bash
        run: pnpm exec tauri bundle --config src-tauri/tauri.release.generated.json --bundles app,dmg
      - name: Bundle Windows installers
        if: ${{ inputs.bundle && matrix.platform == 'windows' }}
        shell: bash
        run: pnpm exec tauri bundle --config src-tauri/tauri.release.generated.json --bundles nsis,msi
      - name: Verify macOS artifacts
        if: ${{ inputs.bundle && matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          bash scripts/verify-macos-bundle.sh "$app" "$dmg"
      - name: Verify Windows artifacts
        if: ${{ inputs.bundle && matrix.platform == 'windows' }}
        shell: pwsh
        run: ./scripts/verify-windows-artifact.ps1
      - name: Upload macOS artifacts
        if: ${{ inputs.bundle && matrix.platform == 'macos' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GBLab-${{ steps.metadata.outputs.version }}-macos-${{ matrix.architecture }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload Windows artifacts
        if: ${{ inputs.bundle && matrix.platform == 'windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GBLab-${{ steps.metadata.outputs.version }}-windows-${{ matrix.architecture }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
