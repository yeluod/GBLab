name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request-title:
    name: Pull request title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          set -euo pipefail

          title_pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]_./-]+\))?(!)?:[[:space:]]+.+$'
          if [[ ! "$PULL_REQUEST_TITLE" =~ $title_pattern ]]; then
            printf '%s\n' \
              'Pull request title must follow Conventional Commit format.' \
              'Examples:' \
              '  feat(simulator): add device scenario' \
              '  fix(release): upload desktop installers' \
              '  chore(main): release 0.4.0' >&2
            exit 1
          fi

  quick-develop:
    name: Quick check (develop)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Check frontend formatting
        run: pnpm run format:check
      - name: Lint frontend
        run: pnpm run lint
      - name: Check frontend types
        run: pnpm run type:check
      - name: Check Rust core
        run: cargo check -p gblab-core --locked

  quality:
    name: Quality
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          rust-components: clippy
      - name: Verify frontend
        run: pnpm run check
      - name: Verify Rust
        run: cargo clippy -p gblab-core --all-targets --all-features --locked -- -D warnings
      - name: Test Rust
        run: cargo test -p gblab-core --locked

  verify:
    name: Verify (${{ matrix.os }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Build desktop without bundle
        run: pnpm tauri build --no-bundle
