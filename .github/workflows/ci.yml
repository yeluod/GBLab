name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  workflow-static:
    name: Workflow and script static checks
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: FFmpeg SDK verifier fixtures
        run: bash scripts/test-verify-ffmpeg-sdk.sh
      - name: Actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Validate JSON manifests
        run: node -e "JSON.parse(require('fs').readFileSync('toolchains/ffmpeg-sdk.lock.json', 'utf8')); JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8'))"
      - name: Validate pinned workflow actions
        run: bash scripts/verify-action-pins.sh
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = $null
          foreach ($path in @('scripts/resolve-ffmpeg-windows.ps1', 'scripts/prepare-ffmpeg-windows.ps1', 'scripts/verify-ffmpeg-windows.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$errors) | Out-Null
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  pull-request-title:
    name: Pull request title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]_./-]+\))?(!)?:[[:space:]]+.+$'
          if [[ ! "$PULL_REQUEST_TITLE" =~ $title_pattern ]]; then
            printf '%s\n' 'Pull request title must follow Conventional Commit format.' 'Examples: feat(media): improve preview controls' '             fix(release): upload desktop installers' >&2
            exit 1
          fi

  quick-develop:
    name: Quick develop checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/prepare-ffmpeg
        with:
          platform: linux
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run type:check
      - run: cargo check -p gblab-core --locked

  frontend-quality:
    name: Frontend quality
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup-build
        with:
          rust: 'false'
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run type:check
      - run: pnpm run test:run
      - run: pnpm run build

  rust-quality:
    name: Rust quality
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup-build
        with:
          frontend: 'false'
          rust-components: clippy
      - uses: ./.github/actions/prepare-ffmpeg
        with:
          platform: linux
      - run: cargo fmt --all -- --check
      - run: cargo check -p gblab-core -p gblab-ffmpeg-support --all-targets --locked
      - run: cargo clippy -p gblab-core -p gblab-ffmpeg-support --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p gblab-core -p gblab-ffmpeg-support --locked

  native-verify:
    name: Native desktop verification
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-desktop.yml
    with:
      platform: all
      ref: ${{ github.sha }}
      bundle: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
