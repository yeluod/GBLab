name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - uses: ./.github/actions/prepare-ffmpeg
        with:
          platform: windows
      - name: Generate release Tauri configuration
        run: node scripts/generate-tauri-release-config.mjs --platform windows --sdk-root .ffmpeg-sdk/windows --output src-tauri/tauri.release.generated.json
      - name: Compile Windows application
        run: pnpm exec tauri build --no-bundle --config src-tauri/tauri.release.generated.json
      - name: Stage FFmpeg DLLs beside application
        shell: pwsh
        run: Copy-Item -Force .ffmpeg-sdk\windows\bin\*.dll target\release\
      - name: Verify Windows FFmpeg linkage
        shell: pwsh
        run: ./scripts/verify-ffmpeg-windows.ps1 -Binary target\release\gblab-desktop.exe -SdkRoot .ffmpeg-sdk\windows
      - name: Bundle Windows installers
        run: pnpm exec tauri bundle --config src-tauri/tauri.release.generated.json --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: gblab-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
