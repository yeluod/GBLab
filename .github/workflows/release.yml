name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            printf 'Formal Release may only run from main; received %s.\n' "$GITHUB_REF" >&2
            exit 1
          fi

  release-please:
    name: Prepare release
    needs: validate-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created == 'true' }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@cc61a07e2da26f85b5e8f4a7b2f0c0f3a0dc7f95 # v5.0.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - name: Read release pull request branch
        id: release-pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$RELEASE_PR_JSON" | jq -er '.headBranchName')"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
      - name: Checkout release pull request branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          fetch-depth: 1
      - name: Set up Rust for lockfile synchronization
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: ./.github/actions/setup-build
        with:
          frontend: 'false'
      - name: Synchronize Cargo lockfile
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git diff --exit-code -- . ':(exclude)Cargo.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(release): synchronize Cargo.lock'
          git push origin "HEAD:refs/heads/$RELEASE_PR_BRANCH"

  build-desktop:
    name: Build release installers
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/build-desktop.yml
    with:
      platform: all
      ref: ${{ needs.release-please.outputs.release_sha }}
      bundle: true
    secrets: inherit

  publish-release:
    name: Publish release
    needs: [release-please, build-desktop]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && needs.build-desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45bbf6a3f2d4b2c7dd2f5f5c8e5a1c5a6f5d # v8.0.1
        with:
          pattern: GBLab-*
          path: release-assets
          merge-multiple: true
      - name: Verify and checksum release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          dmg=(release-assets/**/*.dmg release-assets/*.dmg)
          nsis=(release-assets/**/*-setup.exe release-assets/*-setup.exe)
          msi=(release-assets/**/*.msi release-assets/*.msi)
          [[ ${#dmg[@]} -gt 0 ]] || { printf 'Missing macOS DMG artifact.\n' >&2; exit 1; }
          [[ ${#nsis[@]} -gt 0 ]] || { printf 'Missing Windows NSIS artifact.\n' >&2; exit 1; }
          [[ ${#msi[@]} -gt 0 ]] || { printf 'Missing Windows MSI artifact.\n' >&2; exit 1; }
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
      - name: Verify draft tag and source SHA
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG_NAME" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          [[ "$draft" == 'true' ]] || { echo "Release $TAG_NAME is not a draft." >&2; exit 1; }
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG_NAME" --jq '.object.sha')"
          tag_type="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG_NAME" --jq '.object.type')"
          tag_sha="$tag_object"
          if [[ "$tag_type" == 'tag' ]]; then tag_sha="$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object.sha')"; fi
          [[ "$tag_sha" == "$RELEASE_SHA" ]] || { printf 'Release tag SHA mismatch: expected=%s actual=%s\\n' "$RELEASE_SHA" "$tag_sha" >&2; exit 1; }
      - name: Upload all artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name 'SHA256SUMS.txt' \) -print | sort)
          gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GH_REPO" --clobber
      - name: Publish completed draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: gh release edit "$TAG_NAME" --repo "$GH_REPO" --draft=false --latest
