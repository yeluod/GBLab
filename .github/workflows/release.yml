name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - name: Read release pull request branch
        id: release_pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail

          release_pr_branch="$(printf '%s' "$RELEASE_PR_JSON" | jq -er '.headBranchName')"
          printf 'branch=%s\n' "$release_pr_branch" >> "$GITHUB_OUTPUT"
      - name: Checkout release pull request branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          fetch-depth: 0
      - name: Set up Rust for lockfile synchronization
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Synchronize Cargo lockfile
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR_BRANCH: ${{ steps.release_pr.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --format-version 1 >/dev/null
          cargo metadata --format-version 1 --locked >/dev/null

          if git diff --quiet -- Cargo.lock; then
            printf 'Cargo.lock is already synchronized.\n'
            exit 0
          fi

          git diff --exit-code -- . ':(exclude)Cargo.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(release): synchronize Cargo.lock'
          git push origin "HEAD:refs/heads/${RELEASE_PR_BRANCH}"

  build-macos:
    name: Build macOS application
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
      - uses: ./.github/actions/setup-build
      - name: Build macOS application
        run: pnpm exec tauri build --bundles app,dmg
      - name: Upload macOS installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_assets=(target/release/bundle/dmg/*.dmg)
          if [[ ! -e "${release_assets[0]}" ]]; then
            printf 'No macOS release assets were generated.\n' >&2
            exit 1
          fi

          gh release upload "$TAG_NAME" "${release_assets[@]}" --clobber

  build-windows:
    name: Build Windows installers
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
      - uses: ./.github/actions/setup-build
      - name: Build Windows installers
        run: pnpm exec tauri build --bundles nsis,msi
      - name: Upload Windows installers to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseAssets = @(
            Get-ChildItem "target/release/bundle/nsis/*-setup.exe" -File
            Get-ChildItem "target/release/bundle/msi/*.msi" -File
          )
          if ($releaseAssets.Count -eq 0) {
            throw "No Windows release assets were generated."
          }

          gh release upload $env:TAG_NAME $releaseAssets.FullName --clobber
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  publish-release:
    name: Publish release
    needs:
      - release-please
      - build-macos
      - build-windows
    if: >-
      ${{ always() &&
          needs.release-please.outputs.release_created == 'true' &&
          needs.build-macos.result == 'success' &&
          needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG_NAME" --draft=false --latest
