name: Setup build environment
description: Install the pinned Node.js, pnpm and Rust toolchains with dependency caches

inputs:
  rust-components:
    description: Optional comma-separated Rust toolchain components
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.19.0
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: pnpm
    - name: Set up Rust
      if: ${{ inputs.rust-components == '' }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.0
    - name: Set up Rust with components
      if: ${{ inputs.rust-components != '' }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.0
        components: ${{ inputs.rust-components }}
    - name: Restore Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: gblab-build
    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
