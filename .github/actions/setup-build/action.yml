name: Setup build environment
description: Install pinned Node.js, pnpm and Rust toolchains with dependency caches

inputs:
  frontend:
    description: Install Node.js, pnpm and frontend dependencies
    required: false
    default: 'true'
  rust:
    description: Install Rust toolchain and restore Cargo cache
    required: false
    default: 'true'
  rust-components:
    description: Optional comma-separated Rust toolchain components
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Read repository toolchain versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        pnpm_version="$(sed -n 's/.*"packageManager": "pnpm@\([^"]*\)".*/\1/p' package.json)"
        rust_version="$(sed -n 's/channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
        test -n "$pnpm_version" && test -n "$rust_version"
        printf 'pnpm=%s\n' "$pnpm_version" >> "$GITHUB_OUTPUT"
        printf 'rust=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"
    - name: Set up pnpm
      if: ${{ inputs.frontend == 'true' }}
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.versions.outputs.pnpm }}
        run_install: false
    - name: Set up Node.js
      if: ${{ inputs.frontend == 'true' }}
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Set up Rust
      if: ${{ inputs.rust == 'true' && inputs.rust-components == '' }}
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.98.0
      with:
        toolchain: ${{ steps.versions.outputs.rust }}
    - name: Set up Rust with components
      if: ${{ inputs.rust == 'true' && inputs.rust-components != '' }}
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.98.0
      with:
        toolchain: ${{ steps.versions.outputs.rust }}
        components: ${{ inputs.rust-components }}
    - name: Restore Cargo dependency cache
      if: ${{ inputs.rust == 'true' }}
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: gblab-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
        restore-keys: |
          gblab-cargo-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Rust target cache
      if: ${{ inputs.rust == 'true' }}
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: target
        key: gblab-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'toolchains/ffmpeg-sdk.lock.json') }}
        restore-keys: |
          gblab-target-${{ runner.os }}-${{ runner.arch }}-
    - name: Install frontend dependencies
      if: ${{ inputs.frontend == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
