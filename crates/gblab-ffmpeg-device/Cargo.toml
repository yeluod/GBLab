[package]
name = "gblab-ffmpeg-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Audited safe wrapper for FFmpeg packet, interrupt and capture-device FFI"
publish = false

[dependencies]
rsmpeg.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["CMFormatDescription"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSEnumerator", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
