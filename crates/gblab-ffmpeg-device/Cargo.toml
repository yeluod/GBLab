[package]
name = "gblab-ffmpeg-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Audited safe wrapper for FFmpeg input-device enumeration"
publish = false

[dependencies]
rsmpeg.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSEnumerator", "NSString"] }
